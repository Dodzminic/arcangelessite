{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}GLI Secure Access{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<style>
  :root{--bg:#060d1a;--navy:#0b1631;--accent:#3d7fff;--green:#10b981;--red:#ef4444;--text:#e8edf8;--dim:#7a90b8;--border:rgba(255,255,255,.09);}
  *{box-sizing:border-box;}
  body{min-height:100vh;color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-x:hidden;
       background:linear-gradient(135deg,#060d1a,#0f2050,#060d1a,#0b1631);background-size:300% 300%;animation:bgShift 18s ease infinite;}
  body:has(.flow-card.xl){align-items:flex-start;}
  /* floating glow orbs */
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;pointer-events:none;}
  body::before{width:380px;height:380px;background:#2255cc;top:-120px;left:-100px;animation:floatA 14s ease-in-out infinite;}
  body::after{width:320px;height:320px;background:#10b981;bottom:-120px;right:-80px;opacity:.2;animation:floatB 17s ease-in-out infinite;}

  .flow-card{position:relative;z-index:1;width:100%;max-width:520px;background:rgba(11,22,49,.88);border:1px solid var(--border);border-radius:20px;padding:32px;
       box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(10px);animation:cardIn .7s cubic-bezier(.2,.9,.3,1) both;}
  .flow-card.wide{max-width:640px;} .flow-card.xl{max-width:1100px;}
  .flow-card > *{animation:rise .55s ease backwards;}
  .flow-card > *:nth-child(1){animation-delay:.10s}.flow-card > *:nth-child(2){animation-delay:.18s}
  .flow-card > *:nth-child(3){animation-delay:.26s}.flow-card > *:nth-child(4){animation-delay:.34s}
  .flow-card > *:nth-child(5){animation-delay:.42s}.flow-card > *:nth-child(6){animation-delay:.50s}

  .flow-title{font-size:22px;font-weight:800;margin-bottom:4px;}
  .flow-title span{background:linear-gradient(90deg,#3d7fff,#7fb0ff,#3d7fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3s linear infinite;}
  .flow-sub{color:var(--dim);font-size:12px;letter-spacing:1px;margin-bottom:22px;}
  .flow-card label{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
  .flow-card .form-control{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;transition:.25s;}
  .flow-card .form-control:focus{background:rgba(255,255,255,.08);border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,127,255,.2);color:var(--text);transform:translateY(-1px);}

  .btn-flow{position:relative;overflow:hidden;display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;letter-spacing:1px;color:#fff;text-align:center;
       background:linear-gradient(135deg,#1a4494,#3d7fff);cursor:pointer;transition:transform .2s,filter .2s,box-shadow .2s;}
  .btn-flow::after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.22),transparent);transition:left .55s ease;}
  .btn-flow:hover::after{left:160%;}
  .btn-flow:hover{filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 12px 30px rgba(34,85,204,.45);color:#fff;}
  .btn-flow:active{transform:translateY(0) scale(.98);}
  .btn-flow:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-ghost{background:transparent;border:1px solid var(--border);}
  .btn-green{background:linear-gradient(135deg,#047857,#10b981);}
  .btn-red{background:linear-gradient(135deg,#991b1b,#ef4444);}
  .btn-sm-flow{display:inline-block;width:auto;padding:8px 14px;font-size:12px;border-radius:10px;}

  .flow-alert{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px;border:1px solid;animation:slideIn .45s cubic-bezier(.2,1.3,.4,1) both;}
  .flow-alert.error{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#fca5a5;animation:slideIn .45s ease both,shake .5s .1s ease;}
  .flow-alert.success{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4);color:#6ee7b7;}
  .flow-link{color:var(--accent);text-decoration:none;font-size:12px;transition:.2s;} .flow-link:hover{color:#fff;letter-spacing:.5px;}
  .code-input{text-align:center;font-size:28px!important;letter-spacing:12px;font-weight:800;}

  /* camera box */
  .face-box{position:relative;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--border);aspect-ratio:4/3;}
  .face-box video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  .face-status{position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;font-size:13px;font-weight:700;background:rgba(0,0,0,.65);}
  .face-ring{position:absolute;inset:12% 25%;border:3px dashed rgba(61,127,255,.75);border-radius:50%;pointer-events:none;animation:ringPulse 2s ease-in-out infinite;}
  .face-scan{position:absolute;left:0;right:0;top:0;height:3px;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,#3d7fff,transparent);box-shadow:0 0 18px 4px rgba(61,127,255,.6);animation:scanline 2.4s ease-in-out infinite;}
  .face-box.live .face-scan{opacity:1;}
  .face-ok{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:84px;color:var(--green);background:rgba(16,185,129,.14);}
  .face-box.ok .face-ok{display:flex;animation:pop .55s cubic-bezier(.2,1.6,.4,1);}
  .face-box.ok .face-ring{border-style:solid;border-color:var(--green);animation:none;}
  .face-box.ok .face-scan{opacity:0;}
  .face-preview{display:none;width:96px;height:72px;object-fit:cover;border-radius:12px;border:2px solid var(--green);box-shadow:0 0 22px rgba(16,185,129,.4);transform:scaleX(-1);}
  .face-preview.show{display:block;animation:pop .5s cubic-bezier(.2,1.6,.4,1);}

  .hourglass{animation:flip 2.6s ease-in-out infinite;display:inline-block;}
  .pop-in{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;}

  @keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,90px)}}
  @keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-110px,-70px)}}
  @keyframes cardIn{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  @keyframes shimmer{to{background-position:200% center}}
  @keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(61,127,255,.5)}50%{box-shadow:0 0 0 16px rgba(61,127,255,0)}}
  @keyframes scanline{0%,100%{top:0}50%{top:calc(100% - 3px)}}
  @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes flip{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(180deg)}}
  @keyframes pulseBadge{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
  @keyframes glowLock{0%,100%{filter:drop-shadow(0 0 4px rgba(61,127,255,.5))}50%{filter:drop-shadow(0 0 18px rgba(61,127,255,.95))}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
<div class="flow-card {% block cardclass %}{% endblock %}">
  {% if messages %}{% for m in messages %}
    <div class="flow-alert {% if m.tags == 'success' %}success{% else %}error{% endif %}">{{ m }}</div>
  {% endfor %}{% endif %}
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
